spring.application.name=userservice


spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:userservice}
spring.datasource.username=${DB_USER:userserviceuser}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true

server.port=${SERVER_PORT:4000}

spring.kafka.bootstrap-servers=172.29.148.64:9092

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.service-url.defaultZone=http://${SD_HOST}:${SD_PORT}/${SD_NAME}